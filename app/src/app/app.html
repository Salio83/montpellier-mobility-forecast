<header class="topbar">
  <h1>Montpellier mobility</h1>
  <nav aria-label="Main">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Map</a
    >
    <a routerLink="/stats" routerLinkActive="active" ariaCurrentWhenActive="page">Statistics</a>
  </nav>
  <span class="refresh">
    @if (store.lastRefresh(); as refreshed) {
      Refreshed at {{ refreshed | date: 'HH:mm:ss' }}
    } @else {
      Loading…
    }
  </span>
</header>

@if (store.error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
}

<div class="page">
  <router-outlet />
</div>
