services:
  db:
    # PostgreSQL 18 with the PostGIS 3.6 extension. The tag is pinned so the
    # project does not change version silently when the image is updated.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port is configurable: 5432 is often taken by another local Postgres.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Since PostgreSQL 18, the image stores its data under /var/lib/postgresql.
      - db_data:/var/lib/postgresql
      # SQL files run once, on the first start with an empty volume (D15).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
